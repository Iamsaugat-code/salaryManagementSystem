
<!DOCTYPE html>
<html lang="en" class="overflow-y-scroll">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet"
     href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/static/src/output.css">
</head>
<body class="m-0 overflow-x-hidden">
    

    <div class="flex ">
        <!-- navigation bar  -->
       <div id="nav" class="w-[23%] h-screen relative border pr-6 pl-9 pt-14 pb-20 bg-slate-800 text-white">

            <h2 class="labels mt-4 text-2xl font-bold">Logo</h2>
            <a href="" class="mt-7 text-[18px]  flex items-center gap-3 hover:rounded-md hover:bg-slate-500 px-2 py-3 ">
                <i class="fa-solid fa-table-cells-large"></i>
               <span class="labels">Dashboard</span>
            </a>
            <div class="px-2 py-3 ">
                <button id="menubtn" class="text-[18px]  flex items-center gap-3"><i class="fa-solid fa-file-invoice-dollar"></i> <Span class="labels">Salary ▾</Span></button>
                <div id="menus" class="hidden">
                 <a href="{{url_for('salary_types')}}" class=" text-[16px]  flex items-center gap-3 hover:rounded-md hover:bg-slate-500 px-3 mt-1 py-2 ">
                <i class="fa-solid fa-money-bill-1-wave"></i>
                <span class="labels">Add Salary type</span> </a>
                 <a href="{{url_for('paid_salary')}}" class=" text-[16px]  flex items-center gap-3 hover:rounded-md hover:bg-slate-500 px-3  py-2 ">
                 <i class="fa-solid fa-hand-holding-dollar"></i>
                <Span class="labels">Paid Salary</Span> </a>
                 <a href="{{url_for('view_paid')}}" class=" text-[16px]  flex items-center gap-3 hover:rounded-md hover:bg-slate-500 px-3  py-2 ">
                <i class="fa-solid fa-eye"></i>
                <Span class="labels">View </Span> </a>
                </div>
            </div>

            <div class="px-2 py-3">
                 <button id="menubtn2" class="text-[18px]  border-white flex items-center gap-3"><i class="fa-solid fa-user"></i> <Span class="labels">Employees ▾</Span></button>
               <div id="menu" class="hidden">
                 <a href="{{url_for('add_employe')}}" class=" text-[16px]  flex items-center gap-3 hover:rounded-md hover:bg-slate-500 px-3 mt-1 py-2 ">
                <i class="fa-solid fa-user-plus"></i>
               <Span class="labels">Add Employees</Span></a>
                 <a href="" class=" text-[16px]  flex items-center gap-3 hover:rounded-md hover:bg-slate-500 px-3  py-2 ">
                  <i class="fa-solid fa-eye"></i>
                <Span class="labels">Employees Details</Span></a>
                </div>
            </div>
        </div>

        <!--  -->

        <div class="w-full ">
            <div class=" w-full pl-3 pr-10 h-[75px] border-b-[1px] border-slate-100 flex items-center justify-between">
                <div class=" text-2xl ">
                  <button id="togglebtn" class="p-2">
                     <i class="fa-solid fa-bars"></i>
                    </button>
            </div>
                <div class="absolute right-20 text-xl flex items-center gap-3">
                     <h2 class=" font-semibold capitalize">{{current_user}}</h2>
                    <div class="h-[35px] w-[35px] rounded-full bg-sky-100 flex items-center justify-center">
                        <i class="fa-solid fa-user text-blue-700"></i>
                    </div>
                </div>
            </div>
            <div class="px-10 mt-4 py-2 w-fit border-b">
                <h2 class="font-bold text-2xl leading-9 "> Dashboard</h2>
            </div>
            <div class=" px-20 py-12  flex items-center gap-16">
                <div class="relative px-8 py-6 h-[250px] w-[300px] border-slate-300 border-[1px] rounded-2xl shadow-2xl ">
                    <h2 class="mt-5 font-bold text-2xl">Total Employees </h2>
                    <h2 class="mt-2 font-bold text-3xl ml-1"> {{ total_em }} </h2>
                    <i class="fa-solid fa-users text-6xl absolute right-12 bottom-13 text-blue-950"></i>
                    <a href="{{url_for('show_emp')}}" class=" text-2xl absolute left-10 bottom-10 hover:text-blue-500 hover:underline decoration-2 underline-offset-2 "> view </a>
                </div>
                <div class="relative px-8 py-6 h-[250px] w-[300px] border-slate-300 border-[1px] rounded-2xl shadow-2xl ">
                    <h2 class="mt-5 font-bold text-2xl">Total Salary Types </h2>
                    <h2 class="mt-2 font-bold text-3xl ml-1">{{ total_st }} </h2>
                    <i class="fa-solid fa-sack-dollar text-6xl absolute right-12 bottom-13 text-blue-950"></i>
                    <a href="{{url_for('show_stypes')}}" class=" text-2xl absolute left-10 bottom-10 hover:text-blue-500 hover:underline decoration-2 underline-offset-2 "> view </a>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/home.js">
    </script>
    
</body>
</html>
