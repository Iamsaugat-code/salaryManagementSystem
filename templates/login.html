
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet"
     href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/static/src/output.css">
</head>
<body>
    <div class="min-h-screen bg-slate-100 flex items-center justify-center">

    <div class="bg-white px-6 py-16 w-[30%] rounded-2xl shadow-xl flex items-center justify-center">
        <div class="w-full px-8">
            <form action="{{url_for('checklogin')}}" method="POST">

        <h2 class="text-[38px] text-center font-bold text-[#142D4E]">
            Welcome Back
        </h2>

        <p class="mt-3 text-center text-slate-500">
            Login to your account
        </p>
          {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category,message in messages %}
          {% if category =="error" %}
          <div class=" text-[15px] text-red-500 flex items-center justify-center gap-3  ">
            <i class="fa-solid fa-circle-exclamation"></i>
            {{message}}
          </div>
            {% endif %}
        {% endfor %}
        {% endwith %}

          <div class="mt-8 flex items-center gap-3">
            <i class="fa-solid fa-user text-[20px] text-sky-600"></i>
            <h3 class="text-[20px] font-serif">Username</h3>
          </div>
            <div class="bg-white px-3 py-2.5  border-[2px] border-slate-200 rounded-md mt-2  flex items-center justify-center gap-1 ">
              <input
                type="text"
                name="named"
                required value="{{request.form.get('named','')}}"
                class=" w-full outline-none"
                placeholder=" Enter the username"
                autocomplete="off"
              />
              <div>
              <i class="fa-solid fa-user text-slate-400 "></i>
              </div>
            </div>

                <div class="mt-8 flex items-center gap-3">
            <i class="fa-solid fa-lock text-[20px] text-sky-600"></i>
            <h3 class="text-[20px] font-serif">Password</h3>
          </div>
          <div class="bg-white mt-2 px-3 py-2.5 border-[2px] border-slate-200 rounded-md flex items-center justify-center gap-1">
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Password "
            class="outline-none w-full"
          /> 
          <div>
          <button class="" type="button" id="lock">
            <i class="fa-solid fa-eye-slash  text-gray-400 "></i>
          </button>
          </div>
          </div>

          <div class=" py-[25px] flex items-center justify-center">
        <button class="bg-blue-600 mt-6 hover:bg-blue-700
                       text-white rounded-lg px-4 w-[75%] py-3">
            <h2 class="font-bold text-xl">Login</h2>
        </button>
          </div>
            </form>
        </div>
    </div>

</div>

    </div>

    <script>
        const locked = document.querySelector("#lock");
const passowrd = document.querySelector("#password");
const icon = locked.querySelector("i");

locked.addEventListener("click", () => {
  if (passowrd.type == "password") {
    passowrd.type = "text";
    icon.classList.remove("fa-eye-slash");
    icon.classList.add("fa-eye");
  } else {
    passowrd.type = "password";
    icon.classList.remove("fa-eye");
    icon.classList.add("fa-eye-slash");
  }
});
    </script>
    
</body>
</html>
